plugins {
    id "groovy"
    id "org.grails.grails-gsp"
    id "org.grails.grails-web"
    id "war"
    id "idea"
    id "com.bertramlabs.asset-pipeline"
    id "org.grails.grails-plugin"
    id "application"
    id "eclipse"
    id "maven-publish"
}

group = "grails.turbo"
version = project.findProperty('version')

repositories {
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core/" }
}

configurations {
    configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.seleniumhq.selenium') {
                details.useVersion('4.16.1')
                details.because('Grails BOM aligns some Selenium artifacts to 4.1.4; mixing with 4.16.x causes NoClassDefFoundError (e.g. HasTouchScreen)')
            }
        }
    }
}

dependencies {
    implementation("org.grails:grails-core")
    implementation("org.grails:grails-logging")
    implementation("org.grails:grails-plugin-databinding")
    implementation("org.grails:grails-plugin-i18n")
    implementation("org.grails:grails-plugin-interceptors")
    implementation("org.grails:grails-plugin-rest")
    implementation("org.grails:grails-plugin-services")
    implementation("org.grails:grails-plugin-url-mappings")
    implementation("org.grails:grails-web-boot")
    implementation("org.grails.plugins:gsp")
    implementation("org.grails.plugins:hibernate5")
    implementation("org.grails.plugins:scaffolding")
    implementation("org.hibernate:hibernate-core:5.6.15.Final")
    implementation("org.springframework.boot:spring-boot-autoconfigure")
    implementation("org.springframework.boot:spring-boot-starter")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("org.springframework.boot:spring-boot-starter-logging")
    implementation("org.springframework.boot:spring-boot-starter-tomcat")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    implementation("org.springframework.boot:spring-boot-starter-websocket")
    compileOnly("io.micronaut:micronaut-inject-groovy")
    console("org.grails:grails-console")
    runtimeOnly("com.bertramlabs.plugins:asset-pipeline-grails:4.3.0")
    runtimeOnly("com.h2database:h2")
    runtimeOnly("javax.xml.bind:jaxb-api:2.3.1")
    runtimeOnly("org.apache.tomcat:tomcat-jdbc")
    runtimeOnly("org.fusesource.jansi:jansi:2.4.0")
    runtimeOnly("org.glassfish.web:el-impl:2.2.1-b05")
    testImplementation("io.micronaut:micronaut-inject-groovy")
    testImplementation("org.grails:grails-gorm-testing-support")
    testImplementation("org.grails:grails-web-testing-support")
    testImplementation("org.spockframework:spock-core")
    testImplementation("io.micronaut:micronaut-http-client")

    // Geb for functional/integration testing
    testImplementation("org.grails.plugins:geb")
    testImplementation("org.seleniumhq.selenium:selenium-remote-driver:4.16.1")
    testImplementation("org.seleniumhq.selenium:selenium-api:4.16.1")
    testImplementation("org.seleniumhq.selenium:selenium-support:4.16.1")

    // Runtime Dependencies (Test Only)
    testRuntimeOnly "org.seleniumhq.selenium:selenium-chrome-driver:4.16.1"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-firefox-driver:4.16.1"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-safari-driver:4.16.1"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-edge-driver:4.16.1"
}

application {
    mainClass.set("grails.turbo.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion("17")
}

jar {
    archiveClassifier = ''
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'Grails Turbo Plugin'
                description = 'Hotwired Turbo integration for Grails applications'
                url = 'https://github.com/philippreston/grails-turbo'
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/philippreston/grails-turbo.git'
                    developerConnection = 'scm:git:ssh://github.com/philippreston/grails-turbo.git'
                    url = 'https://github.com/philippreston/grails-turbo'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/philippreston/grails-turbo')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperty "geb.env", System.getProperty('geb.env')
    systemProperty "geb.build.reportsDir", reporting.file("geb/integrationTest")
}

assets {
    packagePlugin = true
    minifyJs = true
    minifyCss = true
}
