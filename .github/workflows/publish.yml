name: Publish

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    name: Publish SNAPSHOT (after CI on main)
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve SNAPSHOT version
        run: |
          BASE=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "VERSION=${BASE}-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish SNAPSHOT to GitHub Packages
        run: ./gradlew publish -Pversion="$VERSION" --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  publish-release:
    name: Publish release (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *-SNAPSHOT ]]; then
            echo "Refusing to publish SNAPSHOT from tag: $TAG"
            exit 1
          fi
          BASE=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [[ "$TAG" != "$BASE" ]]; then
            echo "Tag version ($TAG) must match gradle.properties version ($BASE)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish release to GitHub Packages
        run: ./gradlew test publish -Pversion="$VERSION" --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
